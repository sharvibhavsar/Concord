kind = "web"
previewPath = "/"
title = "Concord"
version = "1.0.0"
id = "artifacts/concord"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25042

[services.development]
run = "pnpm --filter @workspace/concord run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/concord", "run", "build" ]
serve = "static"
publicDir = "artifacts/concord/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25042"
BASE_PATH = "/"
